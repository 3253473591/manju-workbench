      summary: 立绘联合派生（面部特写 + 三视图）
      description: |
        仅立绘结果节点可用。每次点击以**当次选中的立绘**为源图，新建两个结果节点并固定各生成 1 张，
        不使用通用抽卡数量；再次点击不覆盖旧结果。使用隐藏固定模板直接生成，不自由改写或人工选版。
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/MediaNodeIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '202': { $ref: '#/components/responses/SubmissionAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /media/{mediaItemId}/file:
    get:
      tags: [files]
      operationId: getMediaFile
      summary: 读取媒体原文件
      parameters:
        - $ref: '#/components/parameters/MediaItemIdPath'
      responses:
        '200':
          description: 文件字节流
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  /media/{mediaItemId}/thumbnail:
    get:
      tags: [files]
      operationId: getMediaThumbnail
      summary: 读取缩略图（视频取第一帧）
      parameters:
        - $ref: '#/components/parameters/MediaItemIdPath'
      responses:
        '200':
          description: 缩略图
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- generation
  /nodes/{nodeId}/generate:
    post:
      tags: [generation]
      operationId: generateFromNode
      summary: 从节点发起生成（统一入口）
      description: |
        按节点类型分派：文本节点 → 文本/提示词任务；图片方案节点 → 抽卡；
        视频方案节点 → 抽卡；图片结果节点 → 生成图生图方案。等价于各专用接口，便于前端统一调用。
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateInput' }
      responses:
        '202': { $ref: '#/components/responses/SubmissionAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/GenerationInProgress' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /submissions/{submissionId}:
    get:
      tags: [generation]
      operationId: getSubmission
      summary: 提交状态（轮询入口）
      description: logical（用户目标）、physical（执行进程）、delivery（持久化与核验）三层状态分别返回，互不覆盖。
      parameters:
        - $ref: '#/components/parameters/SubmissionIdPath'
      responses:
        '200':
          description: 提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /submissions/{submissionId}/attempts:
    get:
      tags: [generation]
      operationId: listSubmissionAttempts
      summary: 该提交下的 attempt（每次实际模型调用一行）
      parameters:
        - $ref: '#/components/parameters/SubmissionIdPath'
      responses:
        '200':
          description: attempt 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /episodes/{episodeId}/submissions:
    get:
      tags: [generation]
      operationId: listEpisodeSubmissions
      summary: 剧集的提交历史
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 提交分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionPage' }

  # ---------------------------------------------------------------- billing
  /projects/{projectId}/billing/summary:
    get:
      tags: [billing]
      operationId: getProjectBillingSummary
      summary: 项目费用合计
      x-required-roles: [manager, admin]
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: 费用合计（按 attempt 去重，mock 单列不计入实际支出）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/billing/records:
    get:
      tags: [billing]
      operationId: listProjectBillingRecords
      summary: 费用明细
      x-required-roles: [manager, admin]
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 明细分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingRecordPage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /estimate:
    post:
      tags: [billing]
      operationId: estimateGeneration
      summary: 生成前费用预估
      x-required-roles: [manager, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateInput' }
      responses:
        '200':
          description: 预估结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstimateResult' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- files
  /episodes/{episodeId}/imports/text:
    post:
      tags: [files]
      operationId: importTextFile
      summary: 导入 txt / md / docx 作为大纲、剧本或分镜
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, target]
              properties:
                file: { type: string, format: binary }
                target:
                  type: string
                  enum: [outline, script, clip]
                title: { type: string, maxLength: 200 }
      responses:
        '201':
          description: 已创建节点（保留原文件）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /episodes/{episodeId}/imports/image:
    post:
      tags: [files]
      operationId: importImageFile
      summary: 导入立绘 / 面部特写 / 三视图 / 场景 / 道具图片
      description: |
        按命名规范解析（忽略扩展名、完全匹配、不做语义匹配），保留原文件并创建节点。
        导入立绘**不自动创建派生占位**。
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                imageKind:
                  type: string
                  enum: [portrait, face_closeup, three_view, scene, prop]
                canonicalName: { type: string, maxLength: 200 }
                variantName: { type: string, maxLength: 200 }
                clipId: { type: [string, 'null'] }
      responses:
        '201':
          description: 已导入并建立同名匹配引用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
      description: 登录返回的随机会话 token；服务端保存其 SHA-256 哈希。

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    RequestIdHeader:
      name: X-Request-Id
      in: header
      schema: { type: string, maxLength: 64 }
      description: 不传则服务端生成；会写入日志与 generation submission。
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
      description: |
        生成类写请求必填。同一次客户端网络重试复用同一个 key；新用户操作必须换新 key。
        相同 key 不同请求体返回 409 `IDEMPOTENCY_CONFLICT`。
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    EpisodeIdPath:
      name: episodeId
      in: path
      required: true
      schema: { type: string }
    DocumentIdPath:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    NodeIdPath:
      name: nodeId
      in: path
      required: true
      schema: { type: string }
    EdgeIdPath:
      name: edgeId
      in: path
      required: true
      schema: { type: string }
    ClipIdPath:
      name: clipId
      in: path
      required: true
      schema: { type: string }
    ShotIdPath:
      name: shotId
      in: path
      required: true
      schema: { type: string }
    ReferenceIdPath:
      name: referenceId
      in: path
      required: true
      schema: { type: string }
    AssetIdPath:
      name: assetId
      in: path
      required: true
      schema: { type: string }
    MediaNodeIdPath:
      name: mediaNodeId
      in: path
      required: true
      schema: { type: string }
    MediaItemIdPath:
      name: mediaItemId
      in: path
      required: true
      schema: { type: string }
    VersionIdPath:
      name: versionId
      in: path
      required: true
      schema: { type: string }
    SubmissionIdPath:
      name: submissionId
      in: path
      required: true
      schema: { type: string }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string }
    ConfigIdPath:
      name: configId
      in: path
      required: true
      schema: { type: string }
    DocumentActionPath:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum: [optimize, generate-setting, generate-script, split-clips, plan-characters]
    ClipActionPath:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum: [optimize, plan-scenes, plan-props]

  responses:
    InvalidRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthRequired:
      description: 未登录或会话无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthInvalid:
      description: 用户名或密码错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AccountDisabled:
      description: 账号已停用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 当前角色无权执行该操作
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在或已软删除
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 冲突（幂等键或生成进行中）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    VersionConflict:
      description: 乐观锁版本冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RegisterUsernameExists:
      description: 用户名已存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PasswordPolicyFailed:
      description: 密码不符合策略
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    LastAdminRequired:
      description: 必须保留至少一个启用的管理员
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NodeTypeInvalid:
      description: 节点类型与所填字段不匹配
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CanvasLayoutInvalid:
      description: 布局坐标或尺寸非法
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GenerationInProgress:
      description: 同一节点已有未结束的提交
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BusinessRule:
      description: 业务前置条件不满足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AssetReferenceInvalid:
      description: 视频所需图片候选不是恰好一个可用结果
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    FileTooLarge:
      description: 文件超过配置上限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: 不支持的文件类型
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: 本地或供应商限流
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ProviderRejected:
      description: 外部模型明确拒绝
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ProviderUnavailable:
      description: 外部模型不可用或凭证失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ProviderTimeoutUnknown:
      description: 请求结果未知，不能自动重提
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    DeliveryFailed:
      description: 交付核验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: 未预期错误（响应不泄露堆栈）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SubmissionAccepted:
      description: 已受理，后续轮询提交状态
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SubmissionAccepted' }

  schemas:
    # ---------------------------------------------------------- envelope
    ErrorResponse:
      type: object
      required: [success, error, requestId, timestamp]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 前端只依赖 code，不依赖 message 做分支判断
              examples: [CONTENT_VERSION_CONFLICT]
            message: { type: string, description: 可直接展示给用户 }
            details:
              type: object
              additionalProperties: true
              description: 只放脱敏、可操作信息
        requestId: { type: string }
        timestamp: { type: string, format: date-time }

    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - AUTH_REQUIRED
        - AUTH_INVALID
        - ACCOUNT_DISABLED
        - FORBIDDEN
        - REGISTER_USERNAME_EXISTS
        - PASSWORD_POLICY_FAILED
        - LAST_ADMIN_REQUIRED
        - RESOURCE_NOT_FOUND
        - CONTENT_VERSION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - GENERATION_IN_PROGRESS
        - NODE_TYPE_INVALID
        - CANVAS_LAYOUT_INVALID
        - BUSINESS_RULE_VIOLATION
        - ASSET_REFERENCE_INVALID
        - FILE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - MODEL_NOT_AVAILABLE
        - PROVIDER_REJECTED
        - PROVIDER_UNAVAILABLE
        - PROVIDER_TIMEOUT_UNKNOWN
        - DELIVERY_FAILED
        - INTERNAL_ERROR

    # ---------------------------------------------------------- identity
    Role: { type: string, enum: [user, manager, admin] }
    AccountStatus: { type: string, enum: [active, disabled] }
    User:
      type: object
      required: [id, username, displayName, role, status, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    UserList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    UserPage: { $ref: '#/components/schemas/UserList' }
    LoginResult:
      type: object
      required: [user, sessionToken, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        sessionToken:
          type: string
          description: 只在创建响应中返回一次，前端保存到 localStorage
        expiresAt: { type: string, format: date-time }

    # ---------------------------------------------------------- project
    ProjectStatus: { type: string, enum: [active, archived] }
    EpisodeStatus: { type: string, enum: [draft, active, archived] }
    Project:
      type: object
      required: [id, name, description, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        coverMediaId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectDetail:
      type: object
      required: [project, episodes]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        episodes:
          type: array
          items: { $ref: '#/components/schemas/Episode' }
        outlineNodeId:
          type: [string, 'null']
          description: 自动创建的大纲节点 id
    ProjectList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    ProjectPage: { $ref: '#/components/schemas/ProjectList' }
    Episode:
      type: object
      required: [id, projectId, number, title, status, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        number: { type: integer }
        title: { type: string }
        status: { $ref: '#/components/schemas/EpisodeStatus' }
        createdAt: { type: string, format: date-time }
    EpisodeEnvelope:
      type: object
      required: [episode]
      properties:
        episode: { $ref: '#/components/schemas/Episode' }
    EpisodeList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Episode' }
        total: { type: integer }

    # ---------------------------------------------------------- canvas
    CanvasNodeType: { type: string, enum: [text, shot, image, video] }
    EdgeType: { type: string, enum: [derives, references, source] }
    LayoutInput:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number, minimum: 120, maximum: 2000 }
        height: { type: number, minimum: 80, maximum: 4000 }
        zIndex: { type: integer }
    CanvasNodeLayout:
      type: object
      required: [x, y, width, height, zIndex]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }
        zIndex: { type: integer }
    LayoutEnvelope:
      type: object
      required: [nodeId, layout]
      properties:
        nodeId: { type: string }
        layout: { $ref: '#/components/schemas/CanvasNodeLayout' }
    CanvasNode:
      type: object
      required: [id, episodeId, nodeType, label, hidden, createdAt, updatedAt]
      properties:
        id: { type: string }
        episodeId: { type: string }
        nodeType: { $ref: '#/components/schemas/CanvasNodeType' }
        documentId: { type: [string, 'null'] }
        clipId: { type: [string, 'null'] }
        mediaId: { type: [string, 'null'] }
        parentNodeId: { type: [string, 'null'] }
        label: { type: string }
        hidden: { type: boolean }
        contentFingerprint: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CanvasNodeEnvelope:
      type: object
      required: [node]
      properties:
        node: { $ref: '#/components/schemas/CanvasNode' }
    CanvasNodeDetail:
      type: object
      required: [node]
      properties:
        node: { $ref: '#/components/schemas/CanvasNode' }
        layout: { $ref: '#/components/schemas/CanvasNodeLayout' }
        document: { $ref: '#/components/schemas/ContentDocumentDetail' }
        clip: { $ref: '#/components/schemas/ClipDetail' }
        mediaNode: { $ref: '#/components/schemas/MediaNodeDetail' }
    CanvasSnapshot:
      type: object
      required: [episodeId, nodes, edges]
      properties:
        episodeId: { type: string }
        nodes:
          type: array
          items:
            type: object
            required: [node, layout]
            properties:
              node: { $ref: '#/components/schemas/CanvasNode' }
              layout: { $ref: '#/components/schemas/CanvasNodeLayout' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/DependencyEdge' }
    DependencyEdgeInput:
      type: object
      required: [fromNodeId, toNodeId]
      properties:
        fromNodeId: { type: string }
        toNodeId: { type: string }
        edgeType: { $ref: '#/components/schemas/EdgeType' }
        note: { type: string, maxLength: 500 }
    DependencyEdge:
      type: object
      required: [id, episodeId, fromNodeId, toNodeId, edgeType]
      properties:
        id: { type: string }
        episodeId: { type: string }
        fromNodeId: { type: string }
        toNodeId: { type: string }
        edgeType: { $ref: '#/components/schemas/EdgeType' }
        note: { type: string }
    DependencyEdgeEnvelope:
      type: object
      required: [edge]
      properties:
        edge: { $ref: '#/components/schemas/DependencyEdge' }

    # ---------------------------------------------------------- content
    DocumentKind: { type: string, enum: [outline, setting, script, clip] }
    DocumentStatus: { type: string, enum: [draft, saved, archived] }
    RevisionSource: { type: string, enum: [user, ai, import] }
    ContentDocument:
      type: object
      required: [id, episodeId, kind, title, body, status, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        episodeId: { type: string }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        parentDocumentId: { type: [string, 'null'] }
        title: { type: string }
        body:
          type: string
          description: 草稿正文；图片/视频方案节点的提示词不在此返回
        status: { $ref: '#/components/schemas/DocumentStatus' }
        version: { type: integer }
        currentRevisionId: { type: [string, 'null'] }
        boundOutlineRevisionId: { type: [string, 'null'] }
        boundSettingRevisionId: { type: [string, 'null'] }
        sourceRevisionId: { type: [string, 'null'] }
        nodeId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContentDocumentDetail:
      type: object
      required: [document]
      properties:
        document: { $ref: '#/components/schemas/ContentDocument' }
        currentRevision: { $ref: '#/components/schemas/ContentRevision' }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/ContentRevision' }
        hasUnsavedDraft:
          type: boolean
          description: 草稿与当前版本正文不同时为 true
    ContentRevision:
      type: object
      required: [id, documentId, revisionNo, source, title, body, createdAt]
      properties:
        id: { type: string }
        documentId: { type: string }
        revisionNo: { type: integer }
        source: { $ref: '#/components/schemas/RevisionSource' }
        title: { type: string }
        body: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ContentRevisionList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentRevision' }
        total: { type: integer }

    # ---------------------------------------------------------- clips
    ClipStatus: { type: string, enum: [draft, ready, generating, done] }
    ClipShotInput:
      type: object
      properties:
        shotNo: { type: integer, minimum: 1 }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 0 }
        visualText: { type: string }
        cameraText: { type: string }
        dialogueText: { type: string }
        soundText: { type: string }
    ClipShot:
      type: object
      required: [id, clipId, shotNo, startMs, endMs]
      properties:
        id: { type: string }
        clipId: { type: string }
        shotNo: { type: integer }
        startMs: { type: integer }
        endMs: { type: integer }
        visualText: { type: string }
        cameraText: { type: string }
        dialogueText: { type: string }
        soundText: { type: string }
    ClipShotEnvelope:
      type: object
      required: [shot]
      properties:
        shot: { $ref: '#/components/schemas/ClipShot' }
    ClipInput:
      type: object
      properties:
        clipNo: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        durationMs: { type: integer, minimum: 0 }
        characters:
          type: array
          items: { type: string }
        locationName: { type: string, maxLength: 200 }
        body: { type: string }
        status: { $ref: '#/components/schemas/ClipStatus' }
        expectedVersion: { type: integer, minimum: 1 }
    Clip:
      type: object
      required: [id, episodeId, clipNo, title, durationMs, characters, locationName, status, version]
      properties:
        id: { type: string }
        episodeId: { type: string }
        documentId: { type: [string, 'null'] }
        sourceRevisionId: { type: [string, 'null'] }
        clipNo: { type: integer }
        title: { type: string }
        durationMs: { type: integer }
        characters:
          type: array
          items: { type: string }
        locationName: { type: string }
        status: { $ref: '#/components/schemas/ClipStatus' }
        body: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClipEnvelope:
      type: object
      required: [clip]
      properties:
        clip: { $ref: '#/components/schemas/Clip' }
    ClipDetail:
      type: object
      required: [clip]
      properties:
        clip: { $ref: '#/components/schemas/Clip' }
        shots:
          type: array
          items: { $ref: '#/components/schemas/ClipShot' }
        references:
          type: array
          items: { $ref: '#/components/schemas/AssetReference' }
    ClipList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Clip' }
        total: { type: integer }

    # ---------------------------------------------------------- assets
    AssetType: { type: string, enum: [character, scene, prop] }
    AssetStatus: { type: string, enum: [planned, active, archived] }
    AssetPlanItem:
      type: object
      required: [assetType, canonicalName]
      properties:
        assetType: { $ref: '#/components/schemas/AssetType' }
        canonicalName: { type: string, minLength: 1, maxLength: 200 }
        variantName: { type: string, maxLength: 200, default: '' }
        imageKind:
          type: string
          maxLength: 32
          description: 立绘 / 三视图 / 面部特写 / 场景 / 道具
        clipIds:
          type: array
          items: { type: string }
          description: 需要回填规范名的 Clip
        sourceMediaId: { type: [string, 'null'] }
        targetName: { type: string, maxLength: 200 }
    AssetPlanConfirmResult:
      type: object
      required: [assets, createdMediaNodes, reused, references]
      properties:
        assets:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        createdMediaNodes:
          type: array
          items: { $ref: '#/components/schemas/MediaNode' }
          description: 未命中时新建的图片方案节点
        reused:
          type: array
          items: { $ref: '#/components/schemas/MediaNode' }
          description: 命中已有结果或方案而复用的节点
        references:
          type: array
          items: { $ref: '#/components/schemas/AssetReference' }
    Asset:
      type: object
      required: [id, projectId, assetType, canonicalName, variantName, status]
      properties:
        id: { type: string }
        projectId: { type: string }
        assetType: { $ref: '#/components/schemas/AssetType' }
        canonicalName: { type: string }
        variantName: { type: string }
        imageKind: { type: string }
        status: { $ref: '#/components/schemas/AssetStatus' }
        mediaNodeId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AssetDetail:
      type: object
      required: [asset]
      properties:
        asset: { $ref: '#/components/schemas/Asset' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/MediaNode' }
          description: 同名候选的图片方案与结果节点
        usableResultCount:
          type: integer
          description: 未屏蔽且文件可用的图片结果数；视频方案前置校验要求恰好为 1
    AssetList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AssetPage: { $ref: '#/components/schemas/AssetList' }
    AssetReference:
      type: object
      required: [id, clipId, assetId, slotNo, required]
      properties:
        id: { type: string }
        clipId: { type: string }
        assetId: { type: string }
        slotNo: { type: integer }
        required: { type: boolean }
        source: { type: string, enum: [auto, manual] }
        asset: { $ref: '#/components/schemas/Asset' }
    AssetReferenceEnvelope:
      type: object
      required: [reference]
      properties:
        reference: { $ref: '#/components/schemas/AssetReference' }
    AssetReferenceList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssetReference' }
        total: { type: integer }

    # ---------------------------------------------------------- media
    MediaType: { type: string, enum: [image, video, audio, file] }
    MediaKind: { type: string, enum: [image_plan, image_result, video_plan, video_result] }
    DecodeStatus: { type: string, enum: [pending, verified, failed] }
    DeliveryStatus: { type: string, enum: [pending, verified, failed] }
    MediaItem:
      type: object
      required: [id, mediaType, fileKey, mimeType, sizeBytes, sha256, decodeStatus]
      properties:
        id: { type: string }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        fileKey: { type: string }
        originalName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        durationMs: { type: [integer, 'null'] }
        decodeStatus: { $ref: '#/components/schemas/DecodeStatus' }
        fileUrl: { type: string, description: 'GET /media/{id}/file 的相对路径' }
        thumbnailUrl: { type: [string, 'null'] }
    MediaNode:
      type: object
      required: [id, episodeId, mediaKind, blocked]
      properties:
        id: { type: string }
        episodeId: { type: string }
        mediaKind: { $ref: '#/components/schemas/MediaKind' }
        mediaItemId: { type: [string, 'null'] }
        sourceMediaId: { type: [string, 'null'] }
        promptVersionId: { type: [string, 'null'] }
        clipId: { type: [string, 'null'] }
        assetId: { type: [string, 'null'] }
        targetName: { type: string }
        title: { type: string }
        blocked: { type: boolean }
        seed: { type: integer }
        params: { type: object, additionalProperties: true }
    MediaNodeDetail:
      type: object
      required: [mediaNode]
      properties:
        mediaNode: { $ref: '#/components/schemas/MediaNode' }
        visiblePrompt:
          type: [string, 'null']
          description: 当前选中版本的 B 文本；绝不包含隐藏 A 或内部组装文本
        promptVersions:
          type: array
          items: { $ref: '#/components/schemas/PromptVersion' }
        media:
          oneOf:
            - $ref: '#/components/schemas/MediaItem'
            - type: 'null'
        sourceMedia:
          oneOf:
            - $ref: '#/components/schemas/MediaItem'
            - type: 'null'
        referenceImages:
          type: array
          description: 视频方案冻结的参考图与槽位顺序
          items: { $ref: '#/components/schemas/MediaItem' }
        frozenClip:
          oneOf:
            - $ref: '#/components/schemas/Clip'
            - type: 'null'
        sourceSummary:
          type: object
          additionalProperties: true
          description: 来源摘要（版本引用、attempt 计数等），不含隐藏字段
    MediaNodeEnvelope:
      type: object
      required: [mediaNode]
      properties:
        mediaNode: { $ref: '#/components/schemas/MediaNode' }
    PromptSource: { type: string, enum: [ai, user, import, template] }
    PromptVersion:
      type: object
      required: [id, nodeId, revisionNo, visibleText, source, createdAt]
      properties:
        id: { type: string }
        nodeId: { type: string }
        revisionNo: { type: integer }
        visibleText: { type: string, description: 用户可见可编辑的 B 文本 }
        hiddenTemplateVersion: { type: string, description: 只有版本标识，没有正文 }
        finalInputHash: { type: string }
        source: { $ref: '#/components/schemas/PromptSource' }
        createdAt: { type: string, format: date-time }
    PromptVersionEnvelope:
      type: object
      required: [promptVersion]
      properties:
        promptVersion: { $ref: '#/components/schemas/PromptVersion' }
    PromptVersionList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PromptVersion' }
        total: { type: integer }

    # ---------------------------------------------------------- generation
    LogicalStatus: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
    PhysicalStatus:
      type: string
      enum: [reserved, accepted, running, succeeded, failed, unknown]
    Operation:
      type: string
      enum:
        - outline_optimize
        - setting_generate
        - script_generate
        - script_optimize
        - script_split_clips
        - clip_optimize
        - plan_characters
        - plan_scenes
        - plan_props
        - image_plan_create
        - image_plan_optimize
        - image_draw
        - image_derive
        - video_plan_create
        - video_plan_optimize
        - video_draw
    GenerateInput:
      type: object
      properties:
        requirement: { type: string, maxLength: 4000 }
        count: { type: integer, minimum: 1, maximum: 8, default: 1 }
        seed: { type: integer, default: -1 }
        modelConfigId: { type: [string, 'null'] }
        productLabel: { type: string }
        nodeId: { type: [string, 'null'], description: 'POST /estimate 时指定目标节点' }
    SubmissionAccepted:
      type: object
      required: [submissionId, operation, logicalStatus]
      properties:
        submissionId: { type: string }
        operation: { $ref: '#/components/schemas/Operation' }
        logicalStatus: { $ref: '#/components/schemas/LogicalStatus' }
        requestedCount: { type: integer }
        nodeIds:
          type: array
          items: { type: string }
          description: 本次操作创建或影响的节点
    VideoPlanAccepted:
      allOf:
        - $ref: '#/components/schemas/SubmissionAccepted'
        - type: object
          required: [mediaNode]
          properties:
            mediaNode: { $ref: '#/components/schemas/MediaNode' }
    Submission:
      type: object
      required: [id, operation, logicalStatus, requestedCount, createdAt]
      properties:
        id: { type: string }
        operation: { $ref: '#/components/schemas/Operation' }
        logicalStatus: { $ref: '#/components/schemas/LogicalStatus' }
        requestedCount: { type: integer }
        episodeId: { type: [string, 'null'] }
        nodeId: { type: [string, 'null'] }
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        errorCode: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    Attempt:
      type: object
      required: [id, submissionId, attemptNo, operation, physicalStatus, deliveryStatus, isMock]
      properties:
        id: { type: string }
        submissionId: { type: string }
        attemptNo: { type: integer }
        operation: { $ref: '#/components/schemas/Operation' }
        modelConfigId: { type: [string, 'null'] }
        contentFingerprint: { type: string }
        physicalStatus: { $ref: '#/components/schemas/PhysicalStatus' }
        deliveryStatus: { $ref: '#/components/schemas/DeliveryStatus' }
        providerRequestId: { type: string }
        providerTaskId: { type: [string, 'null'] }
        providerStatusRaw: { type: string }
        errorCode: { type: string }
        errorMessage: { type: string }
        isMock: { type: boolean }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        delivery:
          oneOf:
            - $ref: '#/components/schemas/DeliveryRecord'
            - type: 'null'
        usage:
          oneOf:
            - $ref: '#/components/schemas/UsageRecord'
            - type: 'null'
          description: 仅 manager / admin 返回
    DeliveryRecord:
      type: object
      required: [id, attemptId, deliveryStatus, decodeStatus]
      properties:
        id: { type: string }
        attemptId: { type: string }
        deliveryStatus: { $ref: '#/components/schemas/DeliveryStatus' }
        fileKey: { type: string }
        sha256: { type: string }
        decodeStatus: { $ref: '#/components/schemas/DecodeStatus' }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        durationMs: { type: [integer, 'null'] }
        thumbnailFileKey: { type: string }
        verifiedAt: { type: [string, 'null'], format: date-time }
        errorMessage: { type: string }
    SubmissionDetail:
      type: object
      required: [submission]
      properties:
        submission: { $ref: '#/components/schemas/Submission' }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/Attempt' }
        producedNodeIds:
          type: array
          items: { type: string }
    SubmissionList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Submission' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    SubmissionPage: { $ref: '#/components/schemas/SubmissionList' }
    AttemptList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Attempt' }
        total: { type: integer }

    # ---------------------------------------------------------- model / billing
    ProviderCapability: { type: string, enum: [text, image, video] }
    BillingStatus: { type: string, enum: [unknown, estimated, confirmed, mock] }
    ModelConfig:
      type: object
      required: [id, provider, capability, productLabel, enabled]
      properties:
        id: { type: string }
        provider: { type: string }
        capability: { $ref: '#/components/schemas/ProviderCapability' }
        productLabel: { type: string }
        endpointId: { type: string }
        actualModel: { type: string }
        enabled: { type: boolean }
        isDefault: { type: boolean }
        verifiedAt: { type: [string, 'null'], format: date-time }
        spec: { type: object, additionalProperties: true }
        priceAmount: { type: string, description: decimal 字符串 }
        priceCurrency: { type: string }
        priceUnit: { type: string }
        concurrencyLimit: { type: integer }
    ModelConfigInput:
      type: object
      required: [provider, capability, productLabel]
      properties:
        provider: { type: string, default: ark }
        capability: { $ref: '#/components/schemas/ProviderCapability' }
        productLabel: { type: string }
        endpointId: { type: string }
        actualModel: { type: string }
        enabled: { type: boolean, default: true }
        isDefault: { type: boolean, default: false }
        spec: { type: object, additionalProperties: true }
        priceAmount: { type: string }
        priceCurrency: { type: string, default: CNY }
        priceUnit: { type: string }
        concurrencyLimit: { type: integer, minimum: 1, default: 1 }
        credentialRef:
          type: string
          description: 环境变量名；响应中不返回实际密钥
    ModelConfigEnvelope:
      type: object
      required: [modelConfig]
      properties:
        modelConfig: { $ref: '#/components/schemas/ModelConfig' }
    ModelConfigList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ModelConfig' }
        total: { type: integer }
    UsageRecord:
      type: object
      required: [id, attemptId, billingStatus, isMock]
      properties:
        id: { type: string }
        attemptId: { type: string }
        inputUnits: { type: [integer, 'null'], description: '缺失记为 null，不默认 0' }
        outputUnits: { type: [integer, 'null'] }
        unit: { type: object, additionalProperties: true }
        estimatedAmount: { type: [string, 'null'] }
        actualAmount: { type: [string, 'null'] }
        billingStatus: { $ref: '#/components/schemas/BillingStatus' }
        isMock: { type: boolean }
    BillingSummary:
      type: object
      required: [currency, attemptCount, actualTotal, estimatedTotal, mockTotal]
      properties:
        currency: { type: string }
        attemptCount: { type: integer, description: 按 attempt 去重后的计费条数 }
        actualTotal: { type: string }
        estimatedTotal: { type: string }
        mockTotal: { type: string, description: mock 明确标识，不计入实际支出 }
        byOperation:
          type: array
          items:
            type: object
            required: [operation, attemptCount, amount]
            properties:
              operation: { $ref: '#/components/schemas/Operation' }
              attemptCount: { type: integer }
              amount: { type: string }
        unknownUsageCount:
          type: integer
          description: 用量或价格缺失、记为待核对的 attempt 数
    BillingRecord:
      type: object
      required: [attemptId, operation, amount, billingStatus, isMock]
      properties:
        attemptId: { type: string }
        submissionId: { type: string }
        operation: { $ref: '#/components/schemas/Operation' }
        modelConfigId: { type: [string, 'null'] }
        inputUnits: { type: [integer, 'null'] }
        outputUnits: { type: [integer, 'null'] }
        amount: { type: [string, 'null'] }
        currency: { type: string }
        billingStatus: { $ref: '#/components/schemas/BillingStatus' }
        isMock: { type: boolean }
        createdAt: { type: string, format: date-time }
    BillingRecordList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BillingRecord' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    BillingRecordPage: { $ref: '#/components/schemas/BillingRecordList' }
    EstimateResult:
      type: object
      required: [currency, estimatedAmount, isMock, modelConfigId]
      properties:
        currency: { type: string }
        estimatedAmount: { type: string }
        isMock: { type: boolean }
        modelConfigId: { type: [string, 'null'] }
        unit: { type: string }
        notes:
          type: array
          items: { type: string }
          description: 例如「该档位规格尚未核验」

    # ---------------------------------------------------------- imports
    ImportResult:
      type: object
      required: [nodeId, kind, created]
      properties:
        nodeId: { type: string }
        kind: { type: string }
        created:
          type: object
          additionalProperties: true
          description: 解析出的资产身份、图种或文档信息
        references:
          type: array
          items: { $ref: '#/components/schemas/AssetReference' }
        mediaItem:
          oneOf:
            - $ref: '#/components/schemas/MediaItem'
            - type: 'null'
