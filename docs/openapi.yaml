      operationId: drawMedia
      summary: 抽卡（N 次生成 N 个独立同级结果节点）
      description: |
        修改 B 后直接抽卡：先保存新的「用户修改」方案，再优化新 A+B、绑定最终输入并生图。
        同版再次抽卡复用已冻结的最终输入，不再优化。N 次抽卡创建 N 个独立同级结果节点，
        不覆盖旧产物。每次只允许一张源图。
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/MediaNodeIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, minimum: 1, maximum: 8, default: 1 }
                seed:
                  type: integer
                  default: -1
                  description: -1 为随机；固定 seed 时数量强制为 1
                modelConfigId: { type: [string, 'null'] }
                productLabel: { type: string, enum: [lite, pro] }
      responses:
        '202': { $ref: '#/components/responses/SubmissionAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

