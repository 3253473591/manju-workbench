openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: 漫剧工作台 API
  version: 0.1.0
  summary: 大纲 → 剧本 → 分镜 → 图片 → 视频 的可追溯生产接口
  description: |
    本文件是《漫剧工作台 PRD》对应后端的**正式接口契约**，取代 docs/api/conventions.md 的草稿口径。
    实现必须与本文件一致；FastAPI 实际服务的 `/openapi.json` 由测试逐条比对本文件的 path + method 集合。

    ## 通用约定
    - Base path：`/api/v1`
    - 鉴权：数据库随机会话 token，前端 `localStorage` 保存，请求头 `Authorization: Bearer <token>`；不使用 JWT。
    - 时间：UTC ISO 8601（`2026-09-20T12:00:00Z`）。
    - 金额：decimal 字符串，**不使用浮点数**。`user` 角色的任何响应都不含计费字段。
    - 分页：`page`（默认 1）、`pageSize`（默认 20，最大 100），响应统一 `items` / `total` / `page` / `pageSize`。
    - 写请求建议携带 `X-Request-Id`；**生成类写请求必须携带 `Idempotency-Key`**。
    - 乐观锁：内容编辑请求携带 `expectedVersion`，不匹配返回 409 `CONTENT_VERSION_CONFLICT`。

    ## 字段裁剪（服务端强制，不依赖前端）
    - 任意角色都**不返回**：`password_hash`、`token_hash`、`credential_ref` 的实际值、隐藏预设 A 原文、完整内部组装/优化文本、完整供应商 data URL。
    - `user`：不返回单价、预估、费用明细与项目合计。
    - `manager` / `admin`：可返回费用与脱敏 attempt 元数据。

    ## 隐藏 A 与可见 B
    图片/视频方案节点保存两个东西：服务端隐藏预设 A（不通过任何接口返回）与用户可见可编辑的描述 B
    （`PromptVersion.visibleText`）。选版与编辑只面向 B；同版再次抽卡复用已冻结的 `finalInputHash`。

    ## 角色
    | 角色 | 说明 |
    |---|---|
    | `user` | 编辑生产内容、提交生成、查看产物与来源；不返回计费字段 |
    | `manager` | 只读查看生产内容、产物、来源、费用明细与项目合计；不可编辑或生成 |
    | `admin` | 完整生产与计费权限，另含用户管理、角色调整、账号启停、模型配置 |
  contact:
    name: 漫剧工作台
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:8010/api/v1
    description: 本地开发（后端端口 8010）
  - url: http://localhost/api/v1
    description: 部署占位

tags:
  - name: system
    description: 健康检查与运行模式
  - name: auth
    description: 注册、登录、退出、当前用户
  - name: admin
    description: 用户管理、角色与启停、模型配置（admin）
  - name: projects
    description: 项目与剧集
  - name: canvas
    description: 画布节点、布局与依赖边
  - name: documents
    description: 大纲 / 人物设定 / 剧本 的草稿、版本与专用动作
  - name: clips
    description: Clip 与内部镜头、参考资产引用、视频方案入口
  - name: assets
    description: 项目共享资产、资产规划确认与图片方案
  - name: media
    description: 媒体方案/结果节点、提示词版本、抽卡与联合派生
  - name: generation
    description: 提交状态、attempt 与交付
  - name: billing
    description: 费用预估、明细与项目合计（manager/admin）
  - name: files
    description: 文本与图片导入、媒体文件读取

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- system
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                type: object
                required: [status, mode, version]
                properties:
                  status: { type: string, const: ok }
                  mode:
                    type: string
                    enum: [mock, real]
                    description: 当前 APP_MODE
                  version: { type: string }
                  database:
                    type: string
                    enum: [up, down]
        '500': { $ref: '#/components/responses/InternalError' }

  /meta:
    get:
      tags: [system]
      operationId: getMeta
      summary: 运行模式与可用模型档位
      description: |
        只返回**已核验可用**的 real 档位；`APP_MODE=mock` 时 `realAvailable=false`，
        不把未核验的模型伪装成可用。
      security: []
      responses:
        '200':
          description: 元信息
          content:
            application/json:
              schema:
                type: object
                required: [mode, realAvailable, imageProducts, videoProducts]
                properties:
                  mode: { type: string, enum: [mock, real] }
                  realAvailable: { type: boolean }
                  imageProducts:
                    type: array
                    items: { type: string, enum: [lite, pro] }
                  videoProducts:
                    type: array
                    items: { type: string, enum: [mini, fast, '2.5'] }

  # ---------------------------------------------------------------- auth
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 注册（角色固定为 user）
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, displayName]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 120
                  pattern: '^[A-Za-z0-9_.-]+$'
                password: { type: string, minLength: 6, maxLength: 128 }
                displayName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: 注册成功（不返回 token，需再调用登录）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/PasswordPolicyFailed' }
        '409': { $ref: '#/components/responses/RegisterUsernameExists' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录，返回用户资料与新建的会话 token
      description: token 只在该次响应中返回一次；数据库只保存它的哈希。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/AuthInvalid' }
        '403': { $ref: '#/components/responses/AccountDisabled' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 退出登录（吊销当前会话）
      responses:
        '204': { description: 已吊销 }
        '401': { $ref: '#/components/responses/AuthRequired' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: 当前用户与角色
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/AuthRequired' }

  # ---------------------------------------------------------------- admin
  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: 用户列表
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 用户分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{userId}:
    patch:
      tags: [admin]
      operationId: updateUser
      summary: 调整角色、启停账号或修改显示名
      description: 禁止禁用或降级最后一个启用的管理员（409 `LAST_ADMIN_REQUIRED`）。角色变更或停用会吊销该账号已有会话。
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: { $ref: '#/components/schemas/Role' }
                status: { $ref: '#/components/schemas/AccountStatus' }
                displayName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastAdminRequired' }

  /admin/model-configs:
    get:
      tags: [admin]
      operationId: listModelConfigs
      summary: 模型配置列表
      x-required-roles: [admin]
      responses:
        '200':
          description: 模型配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConfigList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createModelConfig
      summary: 新增模型配置
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConfigInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConfigEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/model-configs/{configId}:
    patch:
      tags: [admin]
      operationId: updateModelConfig
      summary: 修改模型配置（启用、价格、并发、规格）
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/ConfigIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConfigInput' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConfigEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- projects
  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 项目列表（所有登录用户共享同一组项目）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 项目分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '401': { $ref: '#/components/responses/AuthRequired' }
    post:
      tags: [projects]
      operationId: createProject
      summary: 新建项目
      description: |
        服务端在同一事务内自动创建「第 1 集」与居中的大纲节点，并建立大纲文档。
        首版只开放单集，但数据仍保留剧集归属。
      x-required-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 2000, default: '' }
      responses:
        '201':
          description: 已创建，含自动生成的剧集与大纲节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}:
    get:
      tags: [projects]
      operationId: getProject
      summary: 项目详情（含剧集与大纲节点 id）
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: 修改项目
      description: 项目元信息不是内容编辑表，按 database-design.md §1 不带乐观锁。
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                status: { $ref: '#/components/schemas/ProjectStatus' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: 软删除项目
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/episodes:
    get:
      tags: [projects]
      operationId: listEpisodes
      summary: 项目下的剧集
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: 剧集列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpisodeList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /episodes/{episodeId}:
    get:
      tags: [projects]
      operationId: getEpisode
      summary: 剧集详情
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPath'
      responses:
        '200':
          description: 剧集
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpisodeEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- canvas
  /episodes/{episodeId}/canvas:
    get:
      tags: [canvas]
      operationId: getCanvas
      summary: 画布快照（节点 + 布局 + 依赖边）
      description: 布局与内容分表保存；本接口一次返回渲染所需的最小集合。
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPath'
      responses:
        '200':
          description: 画布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanvasSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }

  /episodes/{episodeId}/nodes:
    post:
      tags: [canvas]
      operationId: createCanvasNode
      summary: 手动创建画布节点
      description: 拖线仅允许同级或下一阶段；视频不手动同级拖线（由 `POST /clips/{clipId}/video-plans` 创建）。
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeType]
              properties:
                nodeType: { $ref: '#/components/schemas/CanvasNodeType' }
                label: { type: string, maxLength: 200 }
                documentId: { type: [string, 'null'] }
                clipId: { type: [string, 'null'] }
                mediaId: { type: [string, 'null'] }
                parentNodeId: { type: [string, 'null'] }
                layout: { $ref: '#/components/schemas/LayoutInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanvasNodeEnvelope' }
        '400': { $ref: '#/components/responses/NodeTypeInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /canvas/nodes/{nodeId}:
    get:
      tags: [canvas]
      operationId: getCanvasNode
      summary: 节点详情（按类型展开内容）
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
      responses:
        '200':
          description: 节点详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanvasNodeDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [canvas]
      operationId: updateCanvasNode
      summary: 修改节点标签
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanvasNodeEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [canvas]
      operationId: deleteCanvasNode
      summary: 软删除节点（内容的不可变版本与媒体保留）
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /canvas/nodes/{nodeId}/layout:
    patch:
      tags: [canvas]
      operationId: updateNodeLayout
      summary: 保存节点位置与尺寸
      description: 只写 `canvas_node_layout`，不产生内容版本，也不影响内容指纹。
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutInput' }
      responses:
        '200':
          description: 已保存布局
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutEnvelope' }
        '400': { $ref: '#/components/responses/CanvasLayoutInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /canvas/nodes/{nodeId}/visibility:
    patch:
      tags: [canvas]
      operationId: updateNodeVisibility
      summary: 屏蔽 / 解除屏蔽节点
      description: 屏蔽只影响当前节点，不级联下游，不删除内容与媒体，不触发任务。
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanvasNodeEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /episodes/{episodeId}/edges:
    post:
      tags: [canvas]
      operationId: createEdge
      summary: 建立依赖边
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependencyEdgeInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependencyEdgeEnvelope' }
        '400': { $ref: '#/components/responses/NodeTypeInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /canvas/edges/{edgeId}:
    delete:
      tags: [canvas]
      operationId: deleteEdge
      summary: 删除依赖边
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/EdgeIdPath'
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- documents
  /documents/{documentId}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: 文档详情（草稿正文 + 当前版本 + 绑定关系）
      parameters:
        - $ref: '#/components/parameters/DocumentIdPath'
      responses:
        '200':
          description: 文档
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentDocumentDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{documentId}/draft:
    patch:
      tags: [documents]
      operationId: updateDocumentDraft
      summary: 保存草稿正文（不产生版本）
      description: 只更新 `body` / `title`；保存成不可变版本请调用 `POST /documents/{documentId}/revisions`。
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                title: { type: string, maxLength: 200 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已保存草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentDocumentDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }

  /documents/{documentId}/revisions:
    get:
      tags: [documents]
      operationId: listDocumentRevisions
      summary: 不可变历史版本列表
      parameters:
        - $ref: '#/components/parameters/DocumentIdPath'
      responses:
        '200':
          description: 版本列表（倒序）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRevisionList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [documents]
      operationId: createDocumentRevision
      summary: 保存为新的不可变版本
      description: |
        首次保存为 v1。与服务端当前版本比较，**只有实际内容变化才新增版本**；
        切换历史版本（`fromRevisionId`）不新增版本，只把草稿与当前指针切过去。
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentIdPath'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, description: 省略则使用当前草稿 }
                title: { type: string, maxLength: 200 }
                source: { $ref: '#/components/schemas/RevisionSource' }
                expectedVersion: { type: integer, minimum: 1 }
                fromRevisionId:
                  type: [string, 'null']
                  description: 指定则载入该历史版本到草稿/当前指针，不新增版本
      responses:
        '200':
          description: 已有版本被复用（内容未变化或切换历史版本）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentDocumentDetail' }
        '201':
          description: 新增版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentDocumentDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }

  /documents/{documentId}/actions/{action}:
    post:
      tags: [documents]
      operationId: runDocumentAction
      summary: 专用动作（发送优化、生成设定、生成剧本、拆分 Clip、规划人物立绘）
      description: |
        专用按钮固定读取**当前保存版本**生成下一阶段，不做 U/A 判断；每个动作创建一个
        `GenerationSubmission`。响应 202 表示已受理，前端轮询 `GET /submissions/{id}`。

        | action | 适用文档 | 语义 |
        |---|---|---|
        | `optimize` | outline / script / clip | 发送：读取当前正文＋本次需求，N 个优化结果分别创建同级节点 |
        | `generate-setting` | outline | 依据大纲生成人物设定草案 |
        | `generate-script` | outline | 使用保存后大纲＋已确认设定创建剧本候选；设定为空返回 422 |
        | `split-clips` | script | 读取当前保存版本拆成独立 Clip 节点 |
        | `plan-characters` | script | 汇总全部未屏蔽关联 Clip 的人物，产出资产清单（不直接生图） |
      x-required-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentIdPath'
        - $ref: '#/components/parameters/DocumentActionPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                requirement: { type: string, maxLength: 4000, description: 本次需求，不写入历史版本正文 }
                count: { type: integer, minimum: 1, maximum: 8, default: 1 }
                modelConfigId: { type: [string, 'null'] }
      responses:
        '202': { $ref: '#/components/responses/SubmissionAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 幂等键冲突或同一节点已有未结束提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/BusinessRule' }

