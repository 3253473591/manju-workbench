# 漫剧工作台后端依赖 —— 已核验版本的完整锁定
#
# 这份文件由「后端 117 项用例全绿 + 前端构建通过 + alembic check 无漂移」的那台机器
# 冻结而来（Python 3.13.9 / Windows），所有条目都是 `==` 精确版本：
#
#   python -m pip freeze --path backend\.pylibs
#
# 安装（工作区内 --target，不污染系统 Python；从仓库根目录执行）：
#   python -m pip install --target backend\.pylibs -r backend\requirements.lock
#
# backend\requirements.txt 是「声明范围」，这份是「复现锁定」：
#   - 想复现本文档记录的那组结论 → 用本文件；
#   - 想升级依赖 → 改 requirements.txt，装完跑全量 pytest，再用上面的 freeze 命令
#     重新生成本文件，并把新的验证结论写进 docs/acceptance.md。
#
# 平台说明：Windows 上 uvicorn[standard] 不装 uvloop，所以这里没有 uvloop 条目；
# 在 Linux/macOS 上安装本文件会缺少 uvloop（uvicorn 仍可正常运行，只是少了性能优化）。
