name: CI

on:
  push:
    branches: [beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: manju_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - name: Contract probe (offline)
        run: python scripts/contract_probe.py --offline
      - name: pytest
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/manju_test?charset=utf8mb4
          JWT_SECRET: ci-secret-ci-secret-ci-secret-32
          CSRF_ORIGINS: http://127.0.0.1:5173
        run: python -m pytest -q

  frontend:
    name: Frontend build + typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm build

  config-audit:
    name: Config audit (dead settings)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/settings_audit.py --strict

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: manju_e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Migrate + seed e2e data
        working-directory: apps/api
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/manju_e2e?charset=utf8mb4
        run: |
          alembic upgrade head
          cd ../..
          python scripts/seed_e2e.py

      - name: Start API and web
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/manju_e2e?charset=utf8mb4
          JWT_SECRET: ci-secret-ci-secret-ci-secret-32
          CSRF_ORIGINS: http://127.0.0.1:5173
          MEDIA_ROOT: ${{ runner.temp }}/media
          WORKER: "0"
        run: |
          mkdir -p "$MEDIA_ROOT"
          cd apps/api
          nohup python -m uvicorn manju.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          cd ../web
          VITE_API_TARGET=http://127.0.0.1:8000 nohup pnpm dev --port 5173 --strictPort > web.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && break
            sleep 1
          done
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done

      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: pnpm exec playwright test

      - name: Upload logs and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/api/api.log
            apps/web/web.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
