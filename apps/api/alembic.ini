[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

# No sqlalchemy.url here on purpose: migrations/env.py injects it from
# manju.db.database_url() (DATABASE_URL), so the DSN lives in exactly one place.
# Keep this file ASCII-only: alembic reads it with the locale encoding (GBK on
# Chinese Windows) and non-ASCII comments crash config parsing.
